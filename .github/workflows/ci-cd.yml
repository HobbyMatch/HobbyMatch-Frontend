name: CI/CD for Compose Multiplatform App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 30
          build-tools: 30.0.3

      # - name: Run Tests
      #   run: ./gradlew test

      - name: Build Android App
        run: ./gradlew :androidApp:assembleRelease

  build-ios:
    name: Build & Test iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Install Dependencies
        run: pod install --project-directory=iosApp

      # - name: Run Tests
      #  run: ./gradlew test

      - name: Build iOS App
        run: ./gradlew :iosApp:assembleRelease
