name: CI for Compose Multiplatform App (No Deployment) - HobbyMatch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set env
        id: last_tag
        run: |
          TAG=$(git tag --sort=committerdate | tail -1 | sed 's/^v//')
          if [[ -z "$TAG" ]]; then
            TAG="0.1.0"  # Default version if no tags exist
          fi
          echo "LAST_TAG=$TAG" >> $GITHUB_ENV
      - uses: actions-ecosystem/action-bump-semver@v1
        id: bump-semver
        with:
          current_version: ${{ env.LAST_TAG }}
          level: patch
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      - name: Push new version tag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git tag ${{ steps.bump-semver.outputs.new_version }}
          git push --tags "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"

  build_android:
    needs: [prepare_build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: "Setup Gradle"
        uses: gradle/gradle-build-action@v2
      - name: "Build bundle release"
        run: gradle android:bundleRelease
#      - name: "Run tests"
#        run: ./gradlew test
      # No signing or deployment step

  build_ios:
    needs: [prepare_build]
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: "Setup Gradle"
        uses: gradle/gradle-build-action@v2
      - name: "Build xcworkspace"
        run: ./gradlew podInstall
      - name: "Setup app version"
        uses: yanamura/ios-bump-version@v1
        with:
          version: ${{ env.hobby_match_version_name }}
          build-number: ${{ env.hobby_match_version_code }}
          project-path: iosApp
      - name: "Build iOS App"
        run: xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -sdk iphoneos -configuration Release
      # No signing or deployment step